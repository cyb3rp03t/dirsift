<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DirSift demo terminal</title>
<style>
:root { --ground: $ground; --surface-1: $surface_1; --surface-2: $surface_2; --line: $line;
  --line-strong: $line_strong; --ink: $ink; --ink-2: $ink_2; --lamp: $lamp; --ok: $ok;
  --caution: $caution; --alert: $alert; }
@font-face { font-family: "IBM Plex Sans"; src: url("fonts/ibm-plex-sans-latin.woff2") format("woff2"); font-weight: 100 700; }
html, body { margin: 0; width: ${width}px; height: ${height}px; background: var(--ground); overflow: hidden; }
.win { position: absolute; inset: 36px 56px; background: var(--surface-1); border: 1px solid var(--line-strong);
  border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.bar { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px;
  border-bottom: 1px solid var(--line); background: var(--surface-2); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line-strong); }
.name { font-family: "IBM Plex Sans", sans-serif; color: var(--ink-2); font-size: 14px; margin-left: 12px; }
/* The banner is box drawing and block glyphs, which the console's mono subset
   does not carry, so the terminal uses a system mono that has them. */
#t { flex: 1; margin: 0; padding: 18px 22px; overflow: hidden; color: var(--ink); white-space: pre;
  font-family: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; font-size: 15.5px; line-height: 1.32; }
#view { position: absolute; inset: 0; display: none; background: var(--ground);
  align-items: center; justify-content: center; }
#view img { max-height: 840px; max-width: 1360px; }
.p { color: var(--lamp); }
.cur { background: var(--ink); color: var(--ground); }
.bo { font-weight: 700; }
.di { color: var(--ink-2); }
.fc, .fb { color: var(--lamp); }
.fg { color: var(--ok); }
.fy { color: var(--caution); }
.fr, .fm { color: var(--alert); }
.fk { color: var(--ink-2); }
.fw { color: var(--ink); }
/* the banner rows touch, as they do in a terminal */
.art { line-height: 1.0; }
</style>
</head>
<body>
<div class="win">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="name">dirsift demo</span></div>
  <pre id="t"></pre>
</div>
<div id="view"><img id="img" alt=""></div>
<script>
const t = document.getElementById("t");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const PROMPT = '<span class="p">$$</span> ';
const CURSOR = '<span class="cur"> </span>';

function line(htmlText) {
  const d = document.createElement("div");
  d.innerHTML = htmlText || " ";
  if (/[═-▟]/.test(d.textContent)) d.className = "art";
  t.appendChild(d);
  t.scrollTop = t.scrollHeight;
  return d;
}

/* Each step types a command, then prints the lines it really printed, at the
   pace they arrived (a gap longer than 1.2 s is cut to 1.2 s). */
window.play = async function (steps) {
  for (const step of steps) {
    if (step.image) {
      document.getElementById("img").src = step.image;
      document.getElementById("view").style.display = "flex";
      await sleep(step.hold || 3000);
      document.getElementById("view").style.display = "none";
      continue;
    }
    const row = line(PROMPT + CURSOR);
    await sleep(500);
    let typed = "";
    for (const ch of step.cmd) {
      typed += ch;
      row.innerHTML = PROMPT + esc(typed) + CURSOR;
      t.scrollTop = t.scrollHeight;
      await sleep(step.typing || 32);
    }
    await sleep(350);
    row.innerHTML = PROMPT + esc(typed);
    let last = 0;
    for (const [at, text] of step.lines) {
      const due = Math.min(at - last, 1.2) * 1000;
      last = at;
      if (due > 4) await sleep(due);
      line(text);
    }
    await sleep(step.hold || 1500);
  }
  line(PROMPT + CURSOR);
  await sleep(600);
};
</script>
</body>
</html>
