<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DirSift demo card</title>
<style>
@font-face { font-family: "IBM Plex Sans"; src: url("fonts/ibm-plex-sans-latin.woff2") format("woff2"); font-weight: 100 700; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 400 700; }
:root { --ground: $ground; --ink: $ink; --ink-2: $ink_2; --lamp: $lamp; }
html, body { margin: 0; width: ${width}px; height: ${height}px; background: var(--ground); }
body { display: flex; align-items: center; justify-content: center; color: var(--ink);
  font-family: "IBM Plex Sans", sans-serif; }
.wrap { width: 920px; }
.mark svg { width: 216px; height: auto; display: block; margin-bottom: 64px; }
.n { font-family: "JetBrains Mono", monospace; color: var(--lamp); font-size: 22px;
  margin: 0 0 14px; letter-spacing: 0.08em; }
.rule { height: 2px; width: 72px; background: var(--lamp); margin: 0 0 28px; }
h1 { font-size: 60px; font-weight: 600; margin: 0 0 18px; letter-spacing: -0.01em; line-height: 1.1; }
p.l { font-size: 26px; color: var(--ink-2); margin: 0; line-height: 1.45; max-width: 860px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">$mark</div>
  $number
  <div class="rule"></div>
  <h1>$title</h1>
  <p class="l">$line</p>
</div>
</body>
</html>
