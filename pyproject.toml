[project]
name = "dirsift"
version = "0.1.0"
description = "Triage an open directory: walk it, classify what is there, find the script that drives the rest, and write the notes for you."
readme = "README.md"
authors = [{ name = "Alp Cihangir Aslan", email = "67965431+cyb3rp03t@users.noreply.github.com" }]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["threat-intelligence", "open-directory", "malware", "triage", "osint", "dfir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.13,<5",
    "lxml>=6.1,<7",
    "typer>=0.27,<0.28",
    "rich>=15.0,<16",
    "pyfiglet>=1.0,<2",
    "jinja2>=3.1,<4",
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.53,<0.54",
    "python-multipart>=0.0.20,<0.1",
]

[project.urls]
Homepage = "https://github.com/cyb3rp03t/dirsift"
Issues = "https://github.com/cyb3rp03t/dirsift/issues"

[project.scripts]
dirsift = "dirsift.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dirsift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
exclude = ["tests/test_listing.py"]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: builds the wheel, so it takes a few seconds"]
